<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The road back after an affair: five stops. One, the affair ends: contact stops and nothing is hidden. Two, things steady: safety first, no big decisions. Three, the truth: a full, truthful disclosure paced for the hurt partner, the focus of this article. Four, the repair: pain is heard and remorse lands. Five, rebuilding: trust grows back slowly through changed behavior. A loop-back arrow shows that most couples circle back through the hard parts, and that is normal." style="width:100%;height:auto;display:block;background:#fff;font-family:'DM Sans',sans-serif;" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arAh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8a98c"/></marker>
  </defs>
  <text x="360" y="38" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="26" font-weight="600" fill="#3d5c50">The Road Back After an Affair</text>
  <text x="360" y="62" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="15" fill="#9a9490">five stops, and it is rarely a straight line</text>
  <path d="M 500,146 C 470,92 250,92 220,146" fill="none" stroke="#b8a98c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arAh)"/>
  <text x="360" y="100" text-anchor="middle" font-size="12" font-style="italic" fill="#8a857c">most couples circle back. That is normal.</text>
  <rect x="292" y="136" width="136" height="186" rx="14" fill="#f4efe6" stroke="#d8c7a8" stroke-width="1.5"/>
  <line x1="80" y1="176" x2="640" y2="176" stroke="#d8cfbf" stroke-width="4" stroke-linecap="round"/>
  <circle cx="80" cy="176" r="16" fill="#3d5c50"/>
  <text x="80" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="80" y="224" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="17" font-weight="600" fill="#3d5c50">The affair ends</text>
  <text text-anchor="middle" font-size="12.5" fill="#5a544c"><tspan x="80" y="248">Contact stops.</tspan><tspan x="80" y="265">Nothing hidden.</tspan></text>
  <circle cx="220" cy="176" r="16" fill="#3d5c50"/>
  <text x="220" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="220" y="224" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="17" font-weight="600" fill="#3d5c50">Things steady</text>
  <text text-anchor="middle" font-size="12.5" fill="#5a544c"><tspan x="220" y="248">Safety first.</tspan><tspan x="220" y="265">No big decisions</tspan><tspan x="220" y="282">in the worst week.</tspan></text>
  <circle cx="360" cy="176" r="20" fill="#a8863f"/>
  <text x="360" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="360" y="224" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="17" font-weight="600" fill="#6f5b39">The truth</text>
  <text text-anchor="middle" font-size="12.5" fill="#6f5b39"><tspan x="360" y="248">Full, truthful,</tspan><tspan x="360" y="265">and paced for the</tspan><tspan x="360" y="282">hurt partner.</tspan></text>
  <text x="360" y="308" text-anchor="middle" font-size="9" font-weight="700" letter-spacing="1.2" fill="#a8863f">THIS ARTICLE</text>
  <circle cx="500" cy="176" r="16" fill="#3d5c50"/>
  <text x="500" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="500" y="224" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="17" font-weight="600" fill="#3d5c50">The repair</text>
  <text text-anchor="middle" font-size="12.5" fill="#5a544c"><tspan x="500" y="248">Pain is heard.</tspan><tspan x="500" y="265">Remorse lands.</tspan></text>
  <circle cx="640" cy="176" r="16" fill="#3d5c50"/>
  <text x="640" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text>
  <text x="640" y="224" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="17" font-weight="600" fill="#3d5c50">Rebuilding</text>
  <text text-anchor="middle" font-size="12.5" fill="#5a544c"><tspan x="640" y="248">Trust grows back,</tspan><tspan x="640" y="265">slowly, through</tspan><tspan x="640" y="282">changed behavior.</tspan></text>
  <text x="360" y="366" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="17" font-style="italic" fill="#8a857c">The truth is the doorway. The repair comes after.</text>
  <text x="712" y="392" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
