<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;height:auto;display:block;background:#fff;font-family:'DM Sans',system-ui,sans-serif;">
<title>The trauma trap: a self-perpetuating loop</title>
<desc>An old echo fires; coping arrives before feeling; the coping blocks the new experience that would update the alarm; so the threshold stays low; and the next small thing fires the echo again. Willpower cannot break it because the coping that protects you is what keeps it running.</desc>
<defs>
<marker id="tl2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9a87c"/></marker>
</defs>
<rect x="250" y="24" width="220" height="64" rx="10" fill="#3d5c50"/>
<text x="360" y="50" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">1 &#183; An old echo fires</text>
<text x="360" y="70" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.82)">a moment that resembles the past</text>
<rect x="470" y="166" width="230" height="76" rx="10" fill="#f7f0e6" stroke="#c9a87c" stroke-width="1.5"/>
<text x="585" y="192" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3d5c50">2 &#183; Coping fires first</text>
<text x="585" y="211" text-anchor="middle" font-size="10.5" fill="#6b6760">blame, shutdown, freeze, fix &#8212;</text>
<text x="585" y="227" text-anchor="middle" font-size="10.5" fill="#6b6760">before the hurt is even felt</text>
<rect x="250" y="320" width="220" height="76" rx="10" fill="#faf8f4" stroke="#e2ddd6" stroke-width="1.5"/>
<text x="360" y="346" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3d5c50">3 &#183; The new ending</text>
<text x="360" y="365" text-anchor="middle" font-size="10.5" fill="#6b6760">never arrives &#8212; you never learn</text>
<text x="360" y="381" text-anchor="middle" font-size="10.5" fill="#6b6760">the danger has passed</text>
<rect x="20" y="166" width="230" height="76" rx="10" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.5"/>
<text x="135" y="192" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3d5c50">4 &#183; The threshold stays low</text>
<text x="135" y="211" text-anchor="middle" font-size="10.5" fill="#6b6760">the alarm is never updated,</text>
<text x="135" y="227" text-anchor="middle" font-size="10.5" fill="#6b6760">so the next small thing trips it</text>
<path d="M 470 60 C 560 76, 606 118, 588 162" fill="none" stroke="#c9a87c" stroke-width="2" marker-end="url(#tl2)"/>
<path d="M 588 246 C 606 292, 562 344, 474 358" fill="none" stroke="#c9a87c" stroke-width="2" marker-end="url(#tl2)"/>
<path d="M 246 358 C 158 344, 114 292, 132 246" fill="none" stroke="#c9a87c" stroke-width="2" marker-end="url(#tl2)"/>
<path d="M 132 162 C 114 118, 160 76, 250 60" fill="none" stroke="#c9a87c" stroke-width="2" marker-end="url(#tl2)"/>
<text x="360" y="200" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-size="16" font-style="italic" fill="#c9a87c">THE TRAUMA TRAP</text>
<text x="360" y="224" text-anchor="middle" font-size="10.5" fill="#9a9490">self-perpetuating</text>
<text x="360" y="420" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6b6760">Willpower can&#8217;t break it: the coping that protects you is what keeps it running.</text>
<text x="712" y="420" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
</svg>
