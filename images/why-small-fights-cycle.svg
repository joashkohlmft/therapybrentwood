<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;height:auto;display:block;background:#fff;font-family:'DM Sans',system-ui,sans-serif;">
<title>How a small moment escalates into a fight</title>
<desc>A small moment is read as a threat in under a tenth of a second, activating survival mode. One partner's alarm turns up while the other's turns down, and each response triggers the other, forming a loop.</desc>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#b8b2a8"/></marker>
<marker id="ahW" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9a87c"/></marker>
<marker id="ahS" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7a9e8e"/></marker>
</defs>
<rect x="18" y="22" width="200" height="60" rx="10" fill="#faf8f4" stroke="#e2ddd6" stroke-width="1.5"/>
<text x="118" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#3d5c50">A small moment</text>
<text x="118" y="67" text-anchor="middle" font-size="10.5" fill="#9a9490">a sigh, a tone, &#8220;fine.&#8221;</text>
<line x1="222" y1="52" x2="256" y2="52" stroke="#b8b2a8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="260" y="22" width="200" height="60" rx="10" fill="#faf8f4" stroke="#e2ddd6" stroke-width="1.5"/>
<text x="360" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#3d5c50">Your body reads threat</text>
<text x="360" y="67" text-anchor="middle" font-size="10.5" fill="#9a9490">in under 0.1 seconds</text>
<line x1="464" y1="52" x2="498" y2="52" stroke="#b8b2a8" stroke-width="2" marker-end="url(#ah)"/>
<rect x="502" y="22" width="200" height="60" rx="10" fill="#3d5c50"/>
<text x="602" y="48" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">Survival Mode Activated!</text>
<text x="602" y="67" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.82)">the conversation is over</text>
<rect x="40" y="150" width="270" height="122" rx="12" fill="#f7f0e6" stroke="#c9a87c" stroke-width="1.5"/>
<text x="60" y="177" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#c9a87c">ALARM UP &#183; HYPERACTIVATION</text>
<text x="60" y="204" font-size="13.5" font-weight="600" fill="#3d5c50">One of you pushes</text>
<text x="60" y="228" font-size="11.5" fill="#6b6760">Voice rises, you pursue, you protest:</text>
<text x="60" y="248" font-size="11.5" font-style="italic" fill="#6b6760">&#8220;Why won&#8217;t you just talk to me?&#8221;</text>
<rect x="410" y="150" width="270" height="122" rx="12" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.5"/>
<text x="430" y="177" font-size="9.5" font-weight="700" letter-spacing="1.1" fill="#5c8574">ALARM DOWN &#183; HYPOACTIVATION</text>
<text x="430" y="204" font-size="13.5" font-weight="600" fill="#3d5c50">The other goes quiet</text>
<text x="430" y="228" font-size="11.5" fill="#6b6760">You shut down, go blank, withdraw:</text>
<text x="430" y="248" font-size="11.5" font-style="italic" fill="#6b6760">&#8220;I can&#8217;t do this right now.&#8221;</text>
<text x="360" y="130" text-anchor="middle" font-size="10" font-style="italic" fill="#a98a5f">your pursuit is my trigger</text>
<path d="M 312 176 C 360 150, 360 150, 406 176" fill="none" stroke="#c9a87c" stroke-width="2" marker-end="url(#ahW)"/>
<path d="M 406 246 C 360 270, 360 270, 314 246" fill="none" stroke="#7a9e8e" stroke-width="2" marker-end="url(#ahS)"/>
<text x="360" y="292" text-anchor="middle" font-size="10" font-style="italic" fill="#5c8574">your silence is my trigger</text>
<text x="360" y="342" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,serif" font-size="17" font-style="italic" fill="#3d5c50">The topic was never the problem. The cycle the two of you built is.</text>
<text x="712" y="392" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
</svg>
