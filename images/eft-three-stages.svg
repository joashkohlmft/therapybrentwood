<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 384" width="720" height="384" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'DM Sans',sans-serif">
  <rect x="0" y="0" width="720" height="384" fill="#ffffff"/>
  <defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9490"/></marker></defs>
  <text x="360" y="40" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="25" font-weight="600" fill="#3d5c50">How EFT Changes a Relationship</text>
  <text x="360" y="64" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="14.5" fill="#9a9490">three stages, from the cycle to a secure bond</text>
  <rect x="34" y="176" width="200" height="150" rx="13" fill="#f2f0ec" stroke="#d8d2c8" stroke-width="1.5"/><circle cx="134" cy="204" r="15" fill="#a89a7e"/><text x="134" y="209" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="'DM Sans',sans-serif">1</text><text x="134" y="238" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="19" font-weight="600" fill="#3d5c50">De-escalation</text><text text-anchor="middle" font-size="12.5" fill="#7a746c" font-family="'DM Sans',sans-serif"><tspan x="134" y="262">Find and calm the</tspan><tspan x="134" y="280">negative cycle. It</tspan><tspan x="134" y="298">becomes the enemy,</tspan><tspan x="134" y="316">not each other.</tspan></text><rect x="260" y="150" width="200" height="150" rx="13" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.5"/><circle cx="360" cy="178" r="15" fill="#7a9e8e"/><text x="360" y="183" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="'DM Sans',sans-serif">2</text><text x="360" y="212" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="19" font-weight="600" fill="#3d5c50">Restructuring</text><text text-anchor="middle" font-size="12.5" fill="#5a7d6d" font-family="'DM Sans',sans-serif"><tspan x="360" y="236">The withdrawer re-</tspan><tspan x="360" y="254">engages, the pursuer</tspan><tspan x="360" y="272">softens. New reaching,</tspan><tspan x="360" y="290">new answering.</tspan></text><rect x="486" y="124" width="200" height="150" rx="13" fill="#3d5c50"/><circle cx="586" cy="152" r="15" fill="#c9a87c"/><text x="586" y="157" text-anchor="middle" font-size="15" font-weight="700" fill="#3d5c50" font-family="'DM Sans',sans-serif">3</text><text x="586" y="186" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="19" font-weight="600" fill="#ffffff">A Secure Bond</text><text text-anchor="middle" font-size="12.5" fill="rgba(255,255,255,0.9)" font-family="'DM Sans',sans-serif"><tspan x="586" y="210">A new, positive cycle</tspan><tspan x="586" y="228">you can keep on</tspan><tspan x="586" y="246">your own, a lasting</tspan><tspan x="586" y="264">safe haven.</tspan></text>
  <path d="M 236,250 C 250,236 250,214 258,206" fill="none" stroke="#9a9490" stroke-width="2" marker-end="url(#a2)"/>
  <path d="M 462,222 C 476,208 476,186 484,178" fill="none" stroke="#9a9490" stroke-width="2" marker-end="url(#a2)"/>
  <text x="360" y="356" text-anchor="middle" font-size="13" font-style="italic" fill="#8a857c" font-family="'DM Sans',sans-serif">Together we untangle the cycle, and you become each other&#8217;s secure base.</text>
  <text x="712" y="374" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3" font-family="'DM Sans',sans-serif">&#169; Joash Koh, LMFT</text>
</svg>