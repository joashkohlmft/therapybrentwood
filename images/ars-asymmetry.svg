<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ars-title ars-desc" width="1000" height="680">
  <title id="ars-title">Asymmetrical Repair Syndrome: the structural asymmetry</title>
  <desc id="ars-desc">An original framework by Joash Koh, LMFT. One partner, the carrying partner, does 100 percent of the initiating, repair and reaching, on constant nervous-system alarm, until a structural attachment injury forms. The other partner is chronically disengaged, having learned that silence feels safe. All the reaching flows one way and nothing comes back. Unlike the pursuer-withdrawer cycle, where both partners move, in ARS the imbalance is structural and it wounds the one who carries. Left unhealed it moves through three phases: the Raging Fire, the Covert Chase, and the Ash Phase.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=DM+Sans:wght@400;500&amp;display=swap');
      .a-serif{font-family:'Cormorant Garamond',Georgia,serif;}.a-sans{font-family:'DM Sans',system-ui,sans-serif;}</style>
    <marker id="a-warm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9a87c"/></marker>
    <marker id="a-faint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3bcb2"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="680" fill="#faf8f4"/>
  <rect x="14" y="14" width="972" height="652" rx="10" fill="none" stroke="#e2ddd6" stroke-width="1.5"/>
  <text x="500" y="52" text-anchor="middle" class="a-sans" font-size="13" letter-spacing="3" fill="#c9a87c">AN ORIGINAL FRAMEWORK BY JOASH KOH, LMFT &#183; 2024</text>
  <text x="500" y="98" text-anchor="middle" class="a-serif" font-size="40" font-weight="600" fill="#3d5c50">Asymmetrical Repair Syndrome</text>
  <line x1="462" y1="118" x2="538" y2="118" stroke="#c9a87c" stroke-width="1.5"/>
  <path d="M405,250 Q500,196 595,250" fill="none" stroke="#c9a87c" stroke-width="3.5" marker-end="url(#a-warm)"/>
  <text x="500" y="182" text-anchor="middle" class="a-serif" font-style="italic" font-size="19" fill="#6b6760">all the reaching flows one way</text>
  <path d="M596,392 Q500,452 404,398" fill="none" stroke="#c3bcb2" stroke-width="1.6" stroke-dasharray="2,11" marker-end="url(#a-faint)" opacity="0.9"/>
  <text x="500" y="470" text-anchor="middle" class="a-serif" font-style="italic" font-size="18" fill="#a49c92">the reaching goes unanswered</text>
  <circle cx="285" cy="322" r="120" fill="#f7f0e6" stroke="#c9a87c" stroke-width="1.6"/>
  <text x="285" y="272" text-anchor="middle" class="a-sans" font-size="13" letter-spacing="2" fill="#a9803f">THE CARRYING PARTNER</text>
  <text x="285" y="302" text-anchor="middle" class="a-sans" font-size="15" fill="#2c2a26">Initiates, repairs,</text>
  <text x="285" y="322" text-anchor="middle" class="a-sans" font-size="15" fill="#2c2a26">reaches, holds it together</text>
  <line x1="243" y1="341" x2="327" y2="341" stroke="#c9a87c" stroke-width="1"/>
  <text x="285" y="364" text-anchor="middle" class="a-sans" font-size="14" letter-spacing="1.5" font-weight="600" fill="#a9803f">CARRIES 100%</text>
  <text x="285" y="386" text-anchor="middle" class="a-serif" font-style="italic" font-size="15" fill="#6b6760">on constant alarm</text>
  <text x="285" y="472" text-anchor="middle" class="a-serif" font-style="italic" font-size="16" fill="#a9803f">the injury forms here</text>
  <circle cx="715" cy="322" r="120" fill="#eef1ef" stroke="#a9b3ac" stroke-width="1.6"/>
  <text x="715" y="282" text-anchor="middle" class="a-sans" font-size="13" letter-spacing="2" fill="#5f6f68">THE WITHDRAWN PARTNER</text>
  <text x="715" y="312" text-anchor="middle" class="a-sans" font-size="15" fill="#57605b">Chronically</text>
  <text x="715" y="332" text-anchor="middle" class="a-sans" font-size="15" fill="#57605b">disengaged</text>
  <line x1="673" y1="351" x2="757" y2="351" stroke="#a9b3ac" stroke-width="1"/>
  <text x="715" y="374" text-anchor="middle" class="a-sans" font-size="12" letter-spacing="1.5" fill="#6b6760">SILENCE FEELS SAFE</text>
  <line x1="460" y1="560" x2="540" y2="560" stroke="#c9a87c" stroke-width="1.5"/>
  <text x="500" y="582" text-anchor="middle" class="a-sans" font-size="12.5" letter-spacing="3" fill="#c9a87c">THE STRUCTURAL DIFFERENCE</text>
  <text x="500" y="610" text-anchor="middle" class="a-serif" font-size="20" fill="#3d5c50">Pursuer-withdrawer: both partners move. In ARS the imbalance is structural,</text>
  <text x="500" y="634" text-anchor="middle" class="a-serif" font-size="20" fill="#3d5c50">and it wounds the one who carries.</text>
  <text x="500" y="658" text-anchor="middle" class="a-sans" font-size="11" fill="#9a9490">Left unhealed, it moves through three phases: the Raging Fire &#183; the Covert Chase &#183; the Ash Phase</text>
</svg>
