<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A two-by-two showing that flourishing tracks the security of the bond, not the structure: secure couples thrive whether monogamous or open, insecure couples struggle in either." width="720" height="470" style="background:#fff;font-family:'DM Sans',sans-serif;">
    <text x="360" y="38" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="25" font-weight="600" fill="#3d5c50">It's Not the Structure, It's the Bond</text>
    <text x="360" y="62" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="14.5" fill="#9a9490">flourishing tracks the security of the bond, not the shape of the arrangement</text>

    <text x="290" y="96" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a6d3f">MONOGAMOUS</text>
    <text x="550" y="96" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8a6d3f">OPEN</text>
    <text x="158" y="180" text-anchor="end" font-size="11" font-weight="700" letter-spacing="1" fill="#5a7d6d">SECURE</text>
    <text x="158" y="332" text-anchor="end" font-size="11" font-weight="700" letter-spacing="1" fill="#a89a7e">INSECURE</text>

    <rect x="170" y="106" width="240" height="132" rx="10" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.5"/>
    <text x="290" y="176" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="26" font-weight="600" fill="#3d5c50">Thrives</text>
    <text x="290" y="200" text-anchor="middle" font-size="12" fill="#5a7d6d">a secure bond</text>
    <rect x="430" y="106" width="240" height="132" rx="10" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.5"/>
    <text x="550" y="176" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="26" font-weight="600" fill="#3d5c50">Thrives</text>
    <text x="550" y="200" text-anchor="middle" font-size="12" fill="#5a7d6d">a secure bond</text>

    <rect x="170" y="258" width="240" height="132" rx="10" fill="#f2f0ec" stroke="#d8d2c8" stroke-width="1.3"/>
    <text x="290" y="328" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="24" fill="#8a857c">Struggles</text>
    <text x="290" y="352" text-anchor="middle" font-size="12" fill="#a89a7e">an insecure bond</text>
    <rect x="430" y="258" width="240" height="132" rx="10" fill="#f2f0ec" stroke="#d8d2c8" stroke-width="1.3"/>
    <text x="550" y="328" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="24" fill="#8a857c">Struggles</text>
    <text x="550" y="352" text-anchor="middle" font-size="12" fill="#a89a7e">an insecure bond</text>

    <text x="360" y="424" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a857c">The structure barely moves the outcome. The security of the bond decides it.</text>
    <text x="712" y="458" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
  </svg>