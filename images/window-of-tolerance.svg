<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="620" viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wt-title wt-desc">
      <title id="wt-title">The window of tolerance, wide versus narrow</title>
      <desc id="wt-desc">Two nervous systems compared. Each has three zones: hyperarousal at the top (protest, pursuit, panic), the window of tolerance in the middle (calm, present, able to connect), and hypoarousal at the bottom (shutdown, freeze, going blank). Many nervous systems have a wide window. A neurodivergent nervous system often has a narrower window, so overload arrives sooner and more time is spent outside the window. Going slow and keeping sensory input low helps both partners stay inside the window long enough to repair.</desc>
      <defs>
        <style>.wt-serif{font-family:'Cormorant Garamond',Georgia,serif;}.wt-sans{font-family:'DM Sans',system-ui,sans-serif;}</style>
      </defs>
      <rect x="0" y="0" width="1000" height="620" fill="#faf8f4"/>
      <rect x="14" y="14" width="972" height="592" rx="10" fill="none" stroke="#e2ddd6" stroke-width="1.5"/>
      <text x="500" y="50" text-anchor="middle" class="wt-sans" font-size="13" letter-spacing="3.2" fill="#c9a87c">WHY OVERLOAD ARRIVES SOONER FOR SOME NERVOUS SYSTEMS</text>
      <text x="500" y="96" text-anchor="middle" class="wt-serif" font-size="40" font-weight="600" fill="#3d5c50">The Window of Tolerance</text>
      <line x1="462" y1="115" x2="538" y2="115" stroke="#c9a87c" stroke-width="1.5"/>

      <!-- Left panel: wide window -->
      <text x="270" y="158" text-anchor="middle" class="wt-serif" font-size="22" font-weight="600" fill="#3d5c50">Many nervous systems</text>
      <text x="270" y="180" text-anchor="middle" class="wt-serif" font-style="italic" font-size="14" fill="#6b6760">a wide window</text>
      <rect x="90" y="196" width="360" height="72" rx="9" fill="#f6e2d4"/>
      <text x="270" y="228" text-anchor="middle" class="wt-sans" font-size="12" letter-spacing="1.6" fill="#b0653a">HYPERAROUSAL</text>
      <text x="270" y="250" text-anchor="middle" class="wt-sans" font-size="13.5" fill="#8a6a4a">protest, pursuit, panic</text>
      <rect x="90" y="274" width="360" height="196" rx="9" fill="#dcebe2" stroke="#7a9e8e" stroke-width="1.6"/>
      <text x="270" y="360" text-anchor="middle" class="wt-sans" font-size="12" letter-spacing="1.6" fill="#3d5c50">WINDOW OF TOLERANCE</text>
      <text x="270" y="384" text-anchor="middle" class="wt-sans" font-size="13.5" fill="#3d5c50">calm, present, able to connect</text>
      <rect x="90" y="476" width="360" height="72" rx="9" fill="#dfe3ea"/>
      <text x="270" y="508" text-anchor="middle" class="wt-sans" font-size="12" letter-spacing="1.6" fill="#5a6b7a">HYPOAROUSAL</text>
      <text x="270" y="530" text-anchor="middle" class="wt-sans" font-size="13.5" fill="#5a6b7a">shutdown, freeze, going blank</text>

      <!-- Right panel: narrow window -->
      <text x="730" y="158" text-anchor="middle" class="wt-serif" font-size="22" font-weight="600" fill="#a9803f">A neurodivergent nervous system</text>
      <text x="730" y="180" text-anchor="middle" class="wt-serif" font-style="italic" font-size="14" fill="#6b6760">a narrower window</text>
      <rect x="550" y="196" width="360" height="120" rx="9" fill="#f6e2d4"/>
      <text x="730" y="252" text-anchor="middle" class="wt-sans" font-size="12" letter-spacing="1.6" fill="#b0653a">HYPERAROUSAL</text>
      <text x="730" y="274" text-anchor="middle" class="wt-sans" font-size="13.5" fill="#8a6a4a">protest, pursuit, panic</text>
      <rect x="550" y="322" width="360" height="100" rx="9" fill="#dcebe2" stroke="#7a9e8e" stroke-width="1.6"/>
      <text x="730" y="366" text-anchor="middle" class="wt-sans" font-size="12" letter-spacing="1.6" fill="#3d5c50">WINDOW OF TOLERANCE</text>
      <text x="730" y="388" text-anchor="middle" class="wt-sans" font-size="13" fill="#3d5c50">narrower, floods sooner</text>
      <rect x="550" y="428" width="360" height="120" rx="9" fill="#dfe3ea"/>
      <text x="730" y="484" text-anchor="middle" class="wt-sans" font-size="12" letter-spacing="1.6" fill="#5a6b7a">HYPOAROUSAL</text>
      <text x="730" y="506" text-anchor="middle" class="wt-sans" font-size="13.5" fill="#5a6b7a">shutdown, freeze, going blank</text>

      <line x1="460" y1="576" x2="540" y2="576" stroke="#c9a87c" stroke-width="1.5"/>
      <text x="500" y="598" text-anchor="middle" class="wt-serif" font-size="19" fill="#3d5c50">Going slow keeps you both inside the window, long enough to reach each other.</text>
    </svg>