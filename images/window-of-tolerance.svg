<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wot-title wot-desc" width="1000" height="660">
  <title id="wot-title">The Window of Tolerance</title>
  <desc id="wot-desc">A three-zone model of nervous-system arousal. At the top is hyperarousal: fight or flight, panic, racing thoughts, anger, overwhelm. In the middle is the window of tolerance: regulated, present and connected, where you can feel hard things and still stay, and where healing happens. At the bottom is hypoarousal: freeze or shutdown, numb, foggy, disconnected, collapsed. A line shows the nervous system moving between the zones over time. Trauma narrows this window; Brainspotting gently widens it, and the work stays at its edge, never beyond.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=DM+Sans:wght@400;500&amp;display=swap');
      .t-serif{font-family:'Cormorant Garamond',Georgia,serif;}.t-sans{font-family:'DM Sans',system-ui,sans-serif;}</style>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#faf8f4"/>
  <rect x="14" y="14" width="972" height="632" rx="10" fill="none" stroke="#e2ddd6" stroke-width="1.5"/>
  <text x="500" y="50" text-anchor="middle" class="t-sans" font-size="13" letter-spacing="3" fill="#c9a87c">TRAUMA-INFORMED CARE &#183; BRAINSPOTTING</text>
  <text x="500" y="96" text-anchor="middle" class="t-serif" font-size="40" font-weight="600" fill="#3d5c50">The Window of Tolerance</text>
  <line x1="462" y1="115" x2="538" y2="115" stroke="#c9a87c" stroke-width="1.5"/>
  <text x="500" y="138" text-anchor="middle" class="t-serif" font-style="italic" font-size="15" fill="#6b6760">how your nervous system moves, and where healing happens</text>
  <rect x="128" y="152" width="744" height="104" rx="10" fill="#f6ece2" stroke="#d9b98f" stroke-width="1.4"/>
  <rect x="128" y="260" width="744" height="150" rx="10" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="2"/>
  <rect x="128" y="414" width="744" height="104" rx="10" fill="#edf0f1" stroke="#a9b3ac" stroke-width="1.4"/>
  <text x="160" y="190" class="t-sans" font-size="15" letter-spacing="1.5" font-weight="600" fill="#b06a3f">HYPERAROUSAL</text>
  <text x="160" y="216" class="t-serif" font-style="italic" font-size="16" fill="#6b6760">fight or flight</text>
  <text x="160" y="238" class="t-sans" font-size="12.5" fill="#8a857c">panic, racing thoughts, anger, overwhelm</text>
  <text x="160" y="300" class="t-sans" font-size="16" letter-spacing="1.5" font-weight="600" fill="#3d5c50">THE WINDOW OF TOLERANCE</text>
  <text x="160" y="330" class="t-serif" font-style="italic" font-size="17" fill="#3d5c50">regulated, present, connected</text>
  <text x="160" y="356" class="t-sans" font-size="13" fill="#57605b">here you can feel hard things and still stay, this is where healing happens</text>
  <text x="160" y="452" class="t-sans" font-size="15" letter-spacing="1.5" font-weight="600" fill="#5f6f7a">HYPOAROUSAL</text>
  <text x="160" y="478" class="t-serif" font-style="italic" font-size="16" fill="#6b6760">freeze or shutdown</text>
  <text x="160" y="500" class="t-sans" font-size="12.5" fill="#8a857c">numb, foggy, disconnected, collapsed</text>
  <path d="M150,384 C260,382 300,204 380,204 C452,204 470,384 545,384 C620,384 632,470 704,470 C784,470 812,384 850,382" fill="none" stroke="#3d5c50" stroke-width="2" opacity="0.5"/>
  <circle cx="850" cy="382" r="3.5" fill="#3d5c50" opacity="0.6"/>
  <line x1="460" y1="560" x2="540" y2="560" stroke="#c9a87c" stroke-width="1.5"/>
  <text x="500" y="582" text-anchor="middle" class="t-sans" font-size="12.5" letter-spacing="3" fill="#c9a87c">WHAT THERAPY DOES</text>
  <text x="500" y="610" text-anchor="middle" class="t-serif" font-size="20" fill="#3d5c50">Trauma narrows this window. Brainspotting gently widens it,</text>
  <text x="500" y="634" text-anchor="middle" class="t-serif" font-size="20" fill="#3d5c50">and we work only at its edge, never beyond.</text>
</svg>
