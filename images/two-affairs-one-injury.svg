<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two affairs, one injury: a sexual affair (intrusive images, comparison, the body) and an emotional affair (displacement, doubting your own mind) both lead down to a single attachment injury, the safe person becoming the source of danger." style="width:100%;height:auto;display:block;background:#fff;font-family:'DM Sans',sans-serif;">
  <defs><marker id="affArr" markerWidth="9" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7a9e8e"/></marker></defs>
  <text x="360" y="36" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="24" font-weight="600" fill="#3d5c50">Two affairs, one injury</text>
  <text x="360" y="58" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="14" fill="#9a9490">different wound, same broken promise</text>
  <rect x="58" y="92" width="264" height="82" rx="12" fill="#f7f0e6" stroke="#c9a87c" stroke-width="1.6"/>
  <text x="190" y="120" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a9803f">SEXUAL AFFAIR</text>
  <text x="190" y="142" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="14.5" fill="#57605b">intrusive images, comparison,</text>
  <text x="190" y="160" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="14.5" fill="#57605b">a wound in the body</text>
  <rect x="398" y="92" width="264" height="82" rx="12" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.6"/>
  <text x="530" y="120" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.3" fill="#5a7d6d">EMOTIONAL AFFAIR</text>
  <text x="530" y="142" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="14.5" fill="#3d5c50">displacement, and doubting</text>
  <text x="530" y="160" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="14.5" fill="#3d5c50">your own mind</text>
  <path d="M190 178 Q203 246 314 288" fill="none" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#affArr)"/>
  <path d="M530 178 Q517 246 406 288" fill="none" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#affArr)"/>
  <text x="360" y="250" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="13.5" fill="#b6afa4">both press on the same nerve</text>
  <rect x="170" y="300" width="380" height="88" rx="13" fill="#3d5c50"/>
  <text x="360" y="332" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#c9a87c">ATTACHMENT INJURY</text>
  <text x="360" y="356" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="16" fill="#ffffff">the one I turn to for safety</text>
  <text x="360" y="376" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="16" fill="#ffffff">became the source of the danger</text>
  <text x="712" y="418" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
</svg>
