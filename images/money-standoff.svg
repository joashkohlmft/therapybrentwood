<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="610" viewBox="0 0 760 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A two-sided loop showing how a money fight sustains itself: the saver reaches for security, sees spending as danger, and grips tighter, while the spender reaches for freedom, feels controlled, and pushes for room, both meeting at a shared root where money has become the language they fight their safety battles in." style="width:100%;height:auto;display:block;background:#fff;font-family:'DM Sans',sans-serif;"><rect x="0" y="0" width="760" height="610" fill="#ffffff"/>
    <defs><marker id="mfArr" markerWidth="9" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7a9e8e"/></marker></defs>
    <text x="380" y="40" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="26" font-weight="600" fill="#3d5c50">The Money Standoff</text>
    <text x="380" y="65" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="15" fill="#9a9490">two legitimate needs, colliding</text>

    <rect x="70" y="88" width="280" height="40" rx="10" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.4"/>
    <text x="210" y="113" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3d5c50">The saver &#183; reaching for security</text>
    <rect x="410" y="88" width="280" height="40" rx="10" fill="#f7f0e6" stroke="#c9a87c" stroke-width="1.4"/>
    <text x="550" y="113" text-anchor="middle" font-size="13.5" font-weight="600" fill="#8a6d3f">The spender &#183; reaching for freedom</text>

    <rect x="70" y="150" width="280" height="58" rx="8" fill="#f4f8f5" stroke="#dfe8e2" stroke-width="1.2"/>
    <text x="210" y="184" text-anchor="middle" font-size="13.5" fill="#57605b">Sees the spending</text>
    <line x1="210" y1="208" x2="210" y2="234" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#mfArr)"/>
    <rect x="70" y="238" width="280" height="58" rx="8" fill="#f4f8f5" stroke="#dfe8e2" stroke-width="1.2"/>
    <text x="210" y="264" text-anchor="middle" font-size="13.5" fill="#57605b">Feels the danger rising</text>
    <text x="210" y="283" text-anchor="middle" font-size="11.5" fill="#a89a7e" font-style="italic">fear &#183; not safe</text>
    <line x1="210" y1="296" x2="210" y2="322" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#mfArr)"/>
    <rect x="70" y="326" width="280" height="70" rx="8" fill="#eef4f0" stroke="#cddbd3" stroke-width="1.2"/>
    <text x="210" y="352" text-anchor="middle" font-size="13.5" fill="#3d5c50">&#8220;We have to be careful.&#8221;</text>
    <text x="210" y="374" text-anchor="middle" font-size="12.5" fill="#57605b">Grips tighter. Checks, questions.</text>

    <rect x="410" y="150" width="280" height="58" rx="8" fill="#faf6ee" stroke="#eaddc6" stroke-width="1.2"/>
    <text x="550" y="184" text-anchor="middle" font-size="13.5" fill="#6b6760">Feels watched, distrusted</text>
    <line x1="550" y1="208" x2="550" y2="234" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#mfArr)"/>
    <rect x="410" y="238" width="280" height="58" rx="8" fill="#faf6ee" stroke="#eaddc6" stroke-width="1.2"/>
    <text x="550" y="264" text-anchor="middle" font-size="13.5" fill="#6b6760">Pushes for room, spends to breathe</text>
    <text x="550" y="283" text-anchor="middle" font-size="11.5" fill="#b39a72" font-style="italic">controlled &#183; not trusted</text>
    <line x1="550" y1="296" x2="550" y2="322" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#mfArr)"/>
    <rect x="410" y="326" width="280" height="70" rx="8" fill="#f7f0e6" stroke="#e2cfa9" stroke-width="1.2"/>
    <text x="550" y="352" text-anchor="middle" font-size="13.5" fill="#8a6d3f">&#8220;Stop controlling me.&#8221;</text>
    <text x="550" y="374" text-anchor="middle" font-size="12.5" fill="#6b6760">Pulls away. Goes quiet.</text>

    <path d="M 210 396 C 210 452, 300 460, 355 476" fill="none" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#mfArr)"/>
    <path d="M 550 396 C 550 452, 460 460, 405 476" fill="none" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#mfArr)"/>

    <rect x="120" y="486" width="520" height="86" rx="12" fill="#3d5c50" stroke="#2f4a40" stroke-width="1.4"/>
    <text x="380" y="516" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.4" fill="#c9a87c">THE SHARED ROOT</text>
    <text x="380" y="540" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="16" fill="#ffffff">Money became the language we fight our safety battles in.</text>
    <text x="380" y="560" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.72)">security &#183; autonomy &#183; trust &#183; worth</text>

    <text x="752" y="600" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
  </svg>