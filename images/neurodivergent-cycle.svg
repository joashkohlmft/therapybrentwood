<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nd-title nd-desc">
    <title id="nd-title">The neurodivergent cycle: what it looks like and what is really happening</title>
    <desc id="nd-desc">When a neurodivergent nervous system is overwhelmed, one partner withdraws and one partner reaches. The withdrawing partner goes quiet and still, which looks like shutting you out, but is really sensory overload, a system at capacity. The reaching partner repeats and protests, which looks like being too much, but is really rejection sensitivity and a bid for closeness. The work is to respond to the person, not the pattern.</desc>
    <defs>
      <style>.nd-serif{font-family:'Cormorant Garamond',Georgia,serif;}.nd-sans{font-family:'DM Sans',system-ui,sans-serif;}</style>
    </defs>
    <rect x="0" y="0" width="1000" height="640" fill="#faf8f4"/>
    <rect x="14" y="14" width="972" height="612" rx="10" fill="none" stroke="#e2ddd6" stroke-width="1.5"/>
    <rect x="42" y="150" width="426" height="380" rx="10" fill="#eaf2ee" opacity="0.5"/>
    <rect x="532" y="150" width="426" height="380" rx="10" fill="#f7f0e6" opacity="0.6"/>
    <text x="500" y="50" text-anchor="middle" class="nd-sans" font-size="13" letter-spacing="3.2" fill="#c9a87c">WHEN A NEURODIVERGENT NERVOUS SYSTEM IS OVERWHELMED</text>
    <text x="500" y="96" text-anchor="middle" class="nd-serif" font-size="40" font-weight="600" fill="#3d5c50">The Neurodivergent Cycle</text>
    <line x1="462" y1="115" x2="538" y2="115" stroke="#c9a87c" stroke-width="1.5"/>
    <text x="255" y="182" text-anchor="middle" class="nd-serif" font-size="23" font-weight="600" fill="#3d5c50">The partner who withdraws</text>
    <text x="255" y="204" text-anchor="middle" class="nd-serif" font-style="italic" font-size="14" fill="#6b6760">often the autistic or overloaded partner</text>
    <text x="745" y="182" text-anchor="middle" class="nd-serif" font-size="23" font-weight="600" fill="#a9803f">The partner who reaches</text>
    <text x="745" y="204" text-anchor="middle" class="nd-serif" font-style="italic" font-size="14" fill="#6b6760">often the ADHD or protesting partner</text>
    <line x1="500" y1="150" x2="500" y2="530" stroke="#e2ddd6" stroke-width="1.2"/>
    <line x1="42" y1="232" x2="958" y2="232" stroke="#ece7e0" stroke-width="1"/>
    <line x1="42" y1="330" x2="958" y2="330" stroke="#ece7e0" stroke-width="1"/>
    <line x1="42" y1="452" x2="958" y2="452" stroke="#ece7e0" stroke-width="1"/>
    <rect x="418" y="248" width="164" height="25" rx="12.5" fill="#faf8f4"/>
    <text x="500" y="264" text-anchor="middle" class="nd-sans" font-size="11" letter-spacing="1.6" fill="#8a857c">WHAT THEY DO</text>
    <text x="255" y="258" text-anchor="middle" class="nd-sans" font-size="15" fill="#2c2a26">Go quiet and still,</text>
    <text x="255" y="278" text-anchor="middle" class="nd-sans" font-size="15" fill="#2c2a26">stop responding</text>
    <text x="745" y="258" text-anchor="middle" class="nd-sans" font-size="15" fill="#2c2a26">Repeat, push, protest,</text>
    <text x="745" y="278" text-anchor="middle" class="nd-sans" font-size="15" fill="#2c2a26">reach harder</text>
    <rect x="428" y="346" width="144" height="25" rx="12.5" fill="#faf8f4"/>
    <text x="500" y="362" text-anchor="middle" class="nd-sans" font-size="11" letter-spacing="1.6" fill="#8a857c">LOOKS LIKE</text>
    <text x="255" y="356" text-anchor="middle" class="nd-sans" font-size="15" fill="#2c2a26">"You are shutting</text>
    <text x="255" y="376" text-anchor="middle" class="nd-sans" font-size="15" fill="#2c2a26">me out."</text>
    <text x="745" y="356" text-anchor="middle" class="nd-sans" font-size="15" fill="#2c2a26">"You are too much,</text>
    <text x="745" y="376" text-anchor="middle" class="nd-sans" font-size="15" fill="#2c2a26">too intense."</text>
    <rect x="392" y="468" width="216" height="25" rx="12.5" fill="#faf8f4"/>
    <text x="500" y="484" text-anchor="middle" class="nd-sans" font-size="11" letter-spacing="1.6" fill="#8a857c">WHAT IS REALLY HAPPENING</text>
    <text x="255" y="478" text-anchor="middle" class="nd-sans" font-size="15" font-weight="500" fill="#3d5c50">Sensory overload,</text>
    <text x="255" y="498" text-anchor="middle" class="nd-sans" font-size="15" fill="#6b6760">a system at capacity, not rejection</text>
    <text x="745" y="478" text-anchor="middle" class="nd-sans" font-size="15" font-weight="500" fill="#a9803f">Rejection sensitivity,</text>
    <text x="745" y="498" text-anchor="middle" class="nd-sans" font-size="15" fill="#6b6760">a bid for closeness, not attack</text>
    <line x1="460" y1="560" x2="540" y2="560" stroke="#c9a87c" stroke-width="1.5"/>
    <text x="500" y="582" text-anchor="middle" class="nd-sans" font-size="12.5" letter-spacing="3" fill="#c9a87c">THE WORK</text>
    <text x="500" y="608" text-anchor="middle" class="nd-serif" font-size="21" fill="#3d5c50">Respond to the person, not the pattern.</text>
  </svg>