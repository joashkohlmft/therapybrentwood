<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="518" viewBox="0 0 720 518" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gut, Guard, or Grief: three things the ick can be. Gut is information: it is about character, holds steady, and asks you to listen and leave kindly. Guard is protection: it lands right after the other person leans in, latches onto something small and moves, and asks you to get curious before you leave. Grief is the long-haul ick in a marriage: slow, built on small unspoken hurts, and asks you to say the hurt underneath. The feeling is real either way." style="width:100%;height:auto;display:block;background:#fff;font-family:'DM Sans',sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="360" y="38" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="26" font-weight="600" fill="#3d5c50">Gut, Guard, or Grief?</text>
  <text x="360" y="62" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="15" fill="#9a9490">three things the ick can be, and how to tell them apart</text>

  <!-- GUT -->
  <rect x="24" y="84" width="212" height="364" rx="12" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.5"/>
  <rect x="24" y="84" width="212" height="66" rx="12" fill="#3d5c50"/>
  <rect x="24" y="124" width="212" height="26" fill="#3d5c50"/>
  <text x="130.0" y="116" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="23" font-weight="600" letter-spacing="2" fill="#ffffff">GUT</text>
  <text x="130.0" y="137" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="14.5" fill="rgba(255,255,255,0.85)">information</text>
  <text x="130.0" y="178" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#5a7d6d">SOUNDS LIKE</text>
  <text text-anchor="middle" font-size="13.2" fill="#3d5c50" font-style="italic"><tspan x="130.0" y="200">“Charming to me,</tspan><tspan x="130.0" y="218">cold to the server.”</tspan></text>
  <line x1="52" y1="240" x2="208" y2="240" stroke="#7a9e8e" stroke-width="1"/>
  <text x="130.0" y="264" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#5a7d6d">THE TELL</text>
  <text text-anchor="middle" font-size="13.2" fill="#3d5c50"><tspan x="130.0" y="286">About character, not a</tspan><tspan x="130.0" y="304">quirk. Holds steady.</tspan><tspan x="130.0" y="322">You would feel it even if</tspan><tspan x="130.0" y="340">they were not into you.</tspan></text>
  <line x1="52" y1="362" x2="208" y2="362" stroke="#7a9e8e" stroke-width="1"/>
  <text x="130.0" y="386" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#5a7d6d">WHAT IT ASKS OF YOU</text>
  <text text-anchor="middle" font-size="13.2" fill="#3d5c50"><tspan x="130.0" y="408">Listen to it. You can</tspan><tspan x="130.0" y="426">leave, kindly.</tspan></text>

  <!-- GUARD -->
  <rect x="254" y="84" width="212" height="364" rx="12" fill="#f4efe6" stroke="#d8c7a8" stroke-width="1.5"/>
  <rect x="254" y="84" width="212" height="66" rx="12" fill="#a8863f"/>
  <rect x="254" y="124" width="212" height="26" fill="#a8863f"/>
  <text x="360.0" y="116" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="23" font-weight="600" letter-spacing="2" fill="#ffffff">GUARD</text>
  <text x="360.0" y="137" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="14.5" fill="rgba(255,255,255,0.85)">protection</text>
  <text x="360.0" y="178" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#a8863f">SOUNDS LIKE</text>
  <text text-anchor="middle" font-size="13.2" fill="#6f5b39" font-style="italic"><tspan x="360.0" y="200">“Ugh, the way he runs.”</tspan><tspan x="360.0" y="218">“Now it’s how she chews.”</tspan></text>
  <line x1="282" y1="240" x2="438" y2="240" stroke="#d8c7a8" stroke-width="1"/>
  <text x="360.0" y="264" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#a8863f">THE TELL</text>
  <text text-anchor="middle" font-size="13.2" fill="#6f5b39"><tspan x="360.0" y="286">Lands right after they</tspan><tspan x="360.0" y="304">lean in. Latches onto</tspan><tspan x="360.0" y="322">something small, then</tspan><tspan x="360.0" y="340">moves to the next thing.</tspan></text>
  <line x1="282" y1="362" x2="438" y2="362" stroke="#d8c7a8" stroke-width="1"/>
  <text x="360.0" y="386" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#a8863f">WHAT IT ASKS OF YOU</text>
  <text text-anchor="middle" font-size="13.2" fill="#6f5b39"><tspan x="360.0" y="408">Get curious before you</tspan><tspan x="360.0" y="426">walk out the door.</tspan></text>

  <!-- GRIEF -->
  <rect x="484" y="84" width="212" height="364" rx="12" fill="#f2f0ed" stroke="#c4bcae" stroke-width="1.5"/>
  <rect x="484" y="84" width="212" height="66" rx="12" fill="#7d756b"/>
  <rect x="484" y="124" width="212" height="26" fill="#7d756b"/>
  <text x="590.0" y="116" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="23" font-weight="600" letter-spacing="2" fill="#ffffff">GRIEF</text>
  <text x="590.0" y="137" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="14.5" fill="rgba(255,255,255,0.85)">the long-haul ick</text>
  <text x="590.0" y="178" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#8a8278">SOUNDS LIKE</text>
  <text text-anchor="middle" font-size="13.2" fill="#5a544c" font-style="italic"><tspan x="590.0" y="200">“I flinch when he</tspan><tspan x="590.0" y="218">touches my shoulder.”</tspan></text>
  <line x1="512" y1="240" x2="668" y2="240" stroke="#c4bcae" stroke-width="1"/>
  <text x="590.0" y="264" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#8a8278">THE TELL</text>
  <text text-anchor="middle" font-size="13.2" fill="#5a544c"><tspan x="590.0" y="286">Slow, not sudden. Built</tspan><tspan x="590.0" y="304">on small hurts and</tspan><tspan x="590.0" y="322">missed reaches that</tspan><tspan x="590.0" y="340">nobody ever named.</tspan></text>
  <line x1="512" y1="362" x2="668" y2="362" stroke="#c4bcae" stroke-width="1"/>
  <text x="590.0" y="386" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#8a8278">WHAT IT ASKS OF YOU</text>
  <text text-anchor="middle" font-size="13.2" fill="#5a544c"><tspan x="590.0" y="408">Say the hurt underneath,</tspan><tspan x="590.0" y="426">not the list of flaws.</tspan></text>

  <text x="360" y="482" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="17" font-style="italic" fill="#8a857c">The feeling is real either way. The question is what it is telling you.</text>
  <text x="712" y="510" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
</svg>
