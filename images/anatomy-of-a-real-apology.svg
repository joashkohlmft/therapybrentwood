<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anatomy of a real apology. The five moves the partner who caused the hurt makes: the pain lands on you, their hurt and anger are fair, you own exactly what you did, you let your shame show, and you will help them heal. Contrasted with four token apologies that miss the mark, the exit, the minimizer, the forced, and the instrumental, all aimed at ending the apologizer's discomfort rather than the wound." style="width:100%;height:auto;display:block;background:#fff;font-family:'DM Sans',sans-serif;">
  <text x="360" y="34" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="24" font-weight="600" fill="#3d5c50">Anatomy of a real apology</text>
  <text x="360" y="56" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="14" fill="#9a9490">the words &#8216;I&#8217;m sorry&#8217; are not the apology</text>
  <rect x="34" y="94" width="336" height="452" rx="12" fill="#eef4f0" stroke="#6f9483" stroke-width="1.8"/>
  <text x="202" y="122" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5a7d6d">A REAL APOLOGY</text>
  <text x="202" y="141" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="13.5" fill="#7f8a84">what the one who caused the hurt does</text>
  <circle cx="64" cy="188" r="13" fill="#3d5c50"/><text x="64" y="192" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="88" y="185" font-family="'Cormorant Garamond',serif" font-size="16.5" fill="#3d5c50">The pain lands on you</text>
  <text x="88" y="205" font-style="italic" font-size="12" fill="#8a938d">they can see it truly reaches you</text>
  <circle cx="64" cy="260" r="13" fill="#3d5c50"/><text x="64" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="88" y="257" font-family="'Cormorant Garamond',serif" font-size="16.5" fill="#3d5c50">Their hurt and anger are fair</text>
  <text x="88" y="277" font-style="italic" font-size="12" fill="#8a938d">you say plainly their reaction makes sense</text>
  <circle cx="64" cy="332" r="13" fill="#3d5c50"/><text x="64" y="336" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="88" y="329" font-family="'Cormorant Garamond',serif" font-size="16.5" fill="#3d5c50">You own exactly what you did</text>
  <text x="88" y="349" font-style="italic" font-size="12" fill="#8a938d">no vague &#8216;if I hurt you&#8217;</text>
  <circle cx="64" cy="404" r="13" fill="#3d5c50"/><text x="64" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="88" y="401" font-family="'Cormorant Garamond',serif" font-size="16.5" fill="#3d5c50">You let your shame show</text>
  <text x="88" y="421" font-style="italic" font-size="12" fill="#8a938d">you&#8217;re disappointed in yourself too</text>
  <circle cx="64" cy="476" r="13" fill="#3d5c50"/><text x="64" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
  <text x="88" y="473" font-family="'Cormorant Garamond',serif" font-size="16.5" fill="#3d5c50">You will help them heal</text>
  <text x="88" y="493" font-style="italic" font-size="12" fill="#8a938d">you commit to being there from here</text>
  <text x="202" y="528" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="12.5" fill="#7f8a84">together, these turn guilt into an invitation</text>
  <rect x="390" y="94" width="296" height="452" rx="12" fill="#f0efec" stroke="#b9b3aa" stroke-width="1.4"/>
  <text x="538" y="122" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.1" fill="#8f8a80">TOKEN APOLOGIES THAT MISS</text>
  <text x="414" y="180" font-size="10" font-weight="700" letter-spacing="0.6" fill="#a99b7f">THE EXIT</text>
  <text x="414" y="199" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="15" fill="#57605b">&#8216;sorry, what&#8217;s for dinner?&#8217;</text>
  <text x="414" y="253" font-size="10" font-weight="700" letter-spacing="0.6" fill="#a99b7f">THE MINIMIZER</text>
  <text x="414" y="272" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="15" fill="#57605b">&#8216;maybe I did, but&#8230;&#8217;</text>
  <text x="414" y="326" font-size="10" font-weight="700" letter-spacing="0.6" fill="#a99b7f">THE FORCED</text>
  <text x="414" y="345" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="15" fill="#57605b">&#8216;I guess I&#8217;m supposed to&#8230;&#8217;</text>
  <text x="414" y="399" font-size="10" font-weight="700" letter-spacing="0.6" fill="#a99b7f">THE INSTRUMENTAL</text>
  <text x="414" y="418" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="15" fill="#57605b">&#8216;nothing works till I say this&#8217;</text>
  <text x="538" y="486" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="12.5" fill="#b6afa4">aimed at the apologizer&#8217;s</text>
  <text x="538" y="503" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="12.5" fill="#b6afa4">discomfort, not the wound</text>
  <text x="712" y="550" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
  </svg>
