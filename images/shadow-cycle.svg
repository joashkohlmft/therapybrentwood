<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A two-layer diagram: the surface fights over parenting logistics are fueled from below by the couple's own depleted, untended bond." style="width:100%;height:auto;display:block;background:#fff;font-family:'DM Sans',sans-serif;"><rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
    <defs><marker id="scArr" markerWidth="9" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#7a9e8e"/></marker></defs>
    <text x="360" y="40" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="26" font-weight="600" fill="#3d5c50">The Shadow Cycle</text>
    <text x="360" y="64" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="15" fill="#9a9490">the fight is rarely about the fight</text>

    <rect x="120" y="88" width="480" height="82" rx="12" fill="#faf6ee" stroke="#e2cfa9" stroke-width="1.4"/>
    <text x="360" y="115" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.3" fill="#a9803f">WHAT YOU FIGHT ABOUT</text>
    <text x="360" y="150" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="21" fill="#57605b">Bedtime. Chores. Whose turn.</text>

    <line x1="360" y1="170" x2="360" y2="190" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#scArr)"/>
    <text x="360" y="210" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a857c">the emptiness underneath leaks upward as reactivity</text>
    <line x1="360" y1="218" x2="360" y2="238" stroke="#7a9e8e" stroke-width="2.2" marker-end="url(#scArr)"/>

    <rect x="120" y="244" width="480" height="120" rx="12" fill="#3d5c50" stroke="#2f4a40" stroke-width="1.4"/>
    <text x="360" y="272" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.3" fill="#c9a87c">WHAT IS ACTUALLY EMPTY</text>
    <text x="360" y="306" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="19" fill="#ffffff">The couple's own bond, untended.</text>
    <rect x="285" y="322" width="150" height="12" rx="6" fill="none" stroke="#c9a87c" stroke-width="1.4"/>
    <rect x="287" y="324" width="26" height="8" rx="4" fill="#c9a87c"/>
    <text x="360" y="352" text-anchor="middle" font-size="11.5" font-style="italic" fill="#c9a87c">running on empty</text>

    <text x="712" y="388" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
  </svg>