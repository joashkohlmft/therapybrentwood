<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eg-title eg-desc" width="1000" height="700">
  <title id="eg-title">EFT vs. the Gottman Method</title>
  <desc id="eg-desc">A sourced side-by-side comparison of Emotionally Focused Therapy and the Gottman Method across foundation, focus, how it works, evidence, longevity, and who it best suits. EFT is built on attachment theory, restructures the emotional bond from the inside out, has 70 to 75 percent full recovery and a 40-year base including brain imaging, and gains hold and grow at two-year follow-up. The Gottman Method is built on observational research, teaches communication skills from the outside in, is known for landmark predictive research with a smaller therapeutic outcome base, and gains are maintained with ongoing practice. Both are credible; for full recovery the evidence favors EFT.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=DM+Sans:wght@400;500&amp;display=swap');
      .eg-serif{font-family:'Cormorant Garamond',Georgia,serif;}
      .eg-sans{font-family:'DM Sans',system-ui,sans-serif;}
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#faf8f4"/>
  <rect x="14" y="14" width="972" height="672" rx="10" fill="none" stroke="#e2ddd6" stroke-width="1.5"/>

  <rect x="42" y="150" width="426" height="418" rx="10" fill="#eaf2ee" opacity="0.5"/>
  <rect x="532" y="150" width="426" height="418" rx="10" fill="#f7f0e6" opacity="0.6"/>

  <text x="500" y="50" text-anchor="middle" class="eg-sans" font-size="13.5" letter-spacing="3.5" fill="#c9a87c">CHOOSING A COUPLES THERAPY APPROACH</text>
  <text x="500" y="96" text-anchor="middle" class="eg-serif" font-size="42" font-weight="600" fill="#3d5c50">EFT vs. the Gottman Method</text>
  <line x1="462" y1="115" x2="538" y2="115" stroke="#c9a87c" stroke-width="1.5"/>

  <text x="255" y="182" text-anchor="middle" class="eg-serif" font-size="24" font-weight="600" fill="#3d5c50">Emotionally Focused Therapy</text>
  <text x="255" y="203" text-anchor="middle" class="eg-serif" font-style="italic" font-size="14" fill="#6b6760">changes the bond, from the inside</text>
  <text x="745" y="182" text-anchor="middle" class="eg-serif" font-size="24" font-weight="600" fill="#a9803f">The Gottman Method</text>
  <text x="745" y="203" text-anchor="middle" class="eg-serif" font-style="italic" font-size="14" fill="#6b6760">teaches the skills of connection</text>

  <line x1="500" y1="150" x2="500" y2="568" stroke="#e2ddd6" stroke-width="1.2"/>

  <line x1="42" y1="220" x2="958" y2="220" stroke="#ece7e0" stroke-width="1"/>
  <line x1="42" y1="278" x2="958" y2="278" stroke="#ece7e0" stroke-width="1"/>
  <line x1="42" y1="336" x2="958" y2="336" stroke="#ece7e0" stroke-width="1"/>
  <line x1="42" y1="394" x2="958" y2="394" stroke="#ece7e0" stroke-width="1"/>
  <line x1="42" y1="452" x2="958" y2="452" stroke="#ece7e0" stroke-width="1"/>
  <line x1="42" y1="510" x2="958" y2="510" stroke="#ece7e0" stroke-width="1"/>

  <rect x="428" y="236" width="144" height="25" rx="12.5" fill="#faf8f4"/>
  <text x="500" y="252" text-anchor="middle" class="eg-sans" font-size="11" letter-spacing="1.6" fill="#8a857c">FOUNDATION</text>
  <text x="255" y="245" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">Attachment theory, the</text>
  <text x="255" y="264" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">biology of human bonding</text>
  <text x="745" y="245" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">Observational research</text>
  <text x="745" y="264" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">on real couples</text>

  <rect x="440" y="294" width="120" height="25" rx="12.5" fill="#faf8f4"/>
  <text x="500" y="310" text-anchor="middle" class="eg-sans" font-size="11" letter-spacing="1.6" fill="#8a857c">FOCUS</text>
  <text x="255" y="303" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">The emotional bond</text>
  <text x="255" y="322" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">beneath the behavior</text>
  <text x="745" y="303" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">Communication skills</text>
  <text x="745" y="322" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">and behavior patterns</text>

  <rect x="424" y="352" width="152" height="25" rx="12.5" fill="#faf8f4"/>
  <text x="500" y="368" text-anchor="middle" class="eg-sans" font-size="11" letter-spacing="1.6" fill="#8a857c">HOW IT WORKS</text>
  <text x="255" y="361" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">Restructures the bond,</text>
  <text x="255" y="380" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">from the inside out</text>
  <text x="745" y="361" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">Teaches the habits of</text>
  <text x="745" y="380" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">happy couples, outside in</text>

  <rect x="434" y="410" width="132" height="25" rx="12.5" fill="#faf8f4"/>
  <text x="500" y="426" text-anchor="middle" class="eg-sans" font-size="11" letter-spacing="1.6" fill="#8a857c">EVIDENCE</text>
  <text x="255" y="419" text-anchor="middle" class="eg-sans" font-size="15" font-weight="500" fill="#3d5c50">70-75% full recovery&#185;</text>
  <text x="255" y="438" text-anchor="middle" class="eg-sans" font-size="14" fill="#6b6760">40-yr base, incl. brain scans&#178;</text>
  <text x="745" y="419" text-anchor="middle" class="eg-sans" font-size="15" font-weight="500" fill="#a9803f">Landmark predictive research&#8308;</text>
  <text x="745" y="438" text-anchor="middle" class="eg-sans" font-size="14" fill="#6b6760">smaller therapeutic base</text>

  <rect x="432" y="468" width="136" height="25" rx="12.5" fill="#faf8f4"/>
  <text x="500" y="484" text-anchor="middle" class="eg-sans" font-size="11" letter-spacing="1.6" fill="#8a857c">LONGEVITY</text>
  <text x="255" y="477" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">Gains hold and grow</text>
  <text x="255" y="496" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">at 2-year follow-up&#179;</text>
  <text x="745" y="477" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">Maintained with</text>
  <text x="745" y="496" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">ongoing practice</text>

  <rect x="436" y="526" width="128" height="25" rx="12.5" fill="#faf8f4"/>
  <text x="500" y="542" text-anchor="middle" class="eg-sans" font-size="11" letter-spacing="1.6" fill="#8a857c">BEST FOR</text>
  <text x="255" y="535" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">All distress levels,</text>
  <text x="255" y="554" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">including trauma</text>
  <text x="745" y="535" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">Mild-to-moderate,</text>
  <text x="745" y="554" text-anchor="middle" class="eg-sans" font-size="15" fill="#2c2a26">structured skill learning</text>

  <line x1="460" y1="600" x2="540" y2="600" stroke="#c9a87c" stroke-width="1.5"/>
  <text x="500" y="622" text-anchor="middle" class="eg-sans" font-size="12.5" letter-spacing="3" fill="#c9a87c">THE HONEST ANSWER</text>
  <text x="500" y="648" text-anchor="middle" class="eg-serif" font-size="21" fill="#3d5c50">Both are credible and research-backed. For full recovery, the evidence favors EFT.</text>
  <text x="500" y="674" text-anchor="middle" class="eg-sans" font-size="11" fill="#9a9490">1 Johnson et al. 1999&#8195;2 Johnson et al. 2013&#8195;3 Wiebe et al. 2017&#8195;4 Gottman &amp; Levenson 2000</text>
</svg>
