<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sb-title sb-desc" width="1000" height="560">
  <title id="sb-title">Skills vs. the bond</title>
  <desc id="sb-desc">Why communication skills alone often slide back. Skills taught from the outside in help when you are calm, but under attachment panic the thinking brain goes offline and couples slide back to the old cycle. EFT works from the inside out: rebuild felt safety first, the alarm settles, and then the skills finally hold. Skills sit on top; the bond runs underneath.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=DM+Sans:wght@400;500&amp;display=swap');
      .s-serif{font-family:'Cormorant Garamond',Georgia,serif;}.s-sans{font-family:'DM Sans',system-ui,sans-serif;}</style>
    <marker id="sb-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a9e8e"/></marker>
    <marker id="sb-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9a87c"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="560" fill="#faf8f4"/>
  <rect x="14" y="14" width="972" height="532" rx="10" fill="none" stroke="#e2ddd6" stroke-width="1.5"/>
  <text x="500" y="50" text-anchor="middle" class="s-sans" font-size="13" letter-spacing="3" fill="#c9a87c">WHY SKILLS ALONE OFTEN SLIDE BACK</text>
  <text x="500" y="96" text-anchor="middle" class="s-serif" font-size="40" font-weight="600" fill="#3d5c50">Skills vs. the Bond</text>
  <line x1="462" y1="115" x2="538" y2="115" stroke="#c9a87c" stroke-width="1.5"/>
  <rect x="90" y="146" width="820" height="150" rx="12" fill="#f6ece2" opacity="0.55"/>
  <text x="130" y="180" class="s-sans" font-size="14" letter-spacing="1.8" font-weight="600" fill="#b0653a">SKILLS ALONE</text>
  <text x="130" y="202" class="s-serif" font-style="italic" font-size="15" fill="#6b6760">taught from the outside in</text>
  <rect x="130" y="228" width="180" height="48" rx="10" fill="#ffffff" stroke="#cdd8d1" stroke-width="1.4"/>
  <text x="220" y="257" text-anchor="middle" class="s-sans" font-size="14" fill="#2c2a26">Learn the skills</text>
  <rect x="410" y="228" width="180" height="48" rx="10" fill="#ffffff" stroke="#cdd8d1" stroke-width="1.4"/>
  <text x="500" y="257" text-anchor="middle" class="s-sans" font-size="14" fill="#2c2a26">Fine when you're calm</text>
  <rect x="690" y="228" width="180" height="48" rx="10" fill="#f6e2d4" stroke="#d9a06a" stroke-width="1.6"/>
  <text x="780" y="257" text-anchor="middle" class="s-sans" font-size="14" fill="#b0653a">Back to the old cycle</text>
  <line x1="316" y1="252" x2="404" y2="252" stroke="#c9a87c" stroke-width="2" marker-end="url(#sb-arw)"/>
  <line x1="596" y1="252" x2="684" y2="252" stroke="#c9a87c" stroke-width="2" marker-end="url(#sb-arw)"/>
  <rect x="90" y="320" width="820" height="150" rx="12" fill="#eaf2ee" opacity="0.6"/>
  <text x="130" y="354" class="s-sans" font-size="14" letter-spacing="1.8" font-weight="600" fill="#3d5c50">EFT: THE BOND FIRST</text>
  <text x="130" y="376" class="s-serif" font-style="italic" font-size="15" fill="#6b6760">rebuilt from the inside out</text>
  <rect x="130" y="402" width="180" height="48" rx="10" fill="#ffffff" stroke="#cdd8d1" stroke-width="1.4"/>
  <text x="220" y="431" text-anchor="middle" class="s-sans" font-size="14" fill="#2c2a26">Rebuild felt safety</text>
  <rect x="410" y="402" width="180" height="48" rx="10" fill="#ffffff" stroke="#cdd8d1" stroke-width="1.4"/>
  <text x="500" y="431" text-anchor="middle" class="s-sans" font-size="14" fill="#2c2a26">The alarm settles</text>
  <rect x="690" y="402" width="180" height="48" rx="10" fill="#dcebe2" stroke="#7a9e8e" stroke-width="1.6"/>
  <text x="780" y="431" text-anchor="middle" class="s-sans" font-size="14" fill="#3d5c50">Skills finally hold</text>
  <line x1="316" y1="426" x2="404" y2="426" stroke="#7a9e8e" stroke-width="2" marker-end="url(#sb-ar)"/>
  <line x1="596" y1="426" x2="684" y2="426" stroke="#7a9e8e" stroke-width="2" marker-end="url(#sb-ar)"/>
  <line x1="460" y1="500" x2="540" y2="500" stroke="#c9a87c" stroke-width="1.5"/>
  <text x="500" y="522" text-anchor="middle" class="s-sans" font-size="12.5" letter-spacing="3" fill="#c9a87c">THE KEY</text>
  <text x="500" y="548" text-anchor="middle" class="s-serif" font-size="20" fill="#3d5c50">Skills sit on top; the bond runs underneath. Change the bond, and the skills finally hold.</text>
</svg>
