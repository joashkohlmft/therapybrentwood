<svg viewBox="0 0 720 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two Roads From the Same Exhaustion: sleeping outside the home leads from protest to despair to detachment; staying under one roof leads to relief without leaving, contact staying alive, and clarity." style="background:#faf8f4;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="tsWarm" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9803f"/></marker>
    <marker id="tsSage" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a9e8e"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="410" rx="14" fill="#faf8f4" stroke="#e2ddd6" stroke-width="1.5"/>
  <text x="32" y="40" font-size="10" font-weight="700" letter-spacing="2" fill="#a9803f">WHEN YOU CANNOT KEEP GOING</text>
  <text x="32" y="70" font-family="'Cormorant Garamond',Georgia,serif" font-size="26" font-weight="600" fill="#3d5c50">Two Roads From the Same Exhaustion</text>
  <line x1="32" y1="84" x2="96" y2="84" stroke="#c9a87c" stroke-width="3"/>
  <rect x="24" y="176" width="152" height="64" rx="12" fill="#3d5c50"/>
  <text x="100" y="203" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">We cannot keep</text>
  <text x="100" y="221" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">doing this</text>
  <path d="M 176,196 C 196,196 194,150 214,150" fill="none" stroke="#c9a87c" stroke-width="1.8" marker-end="url(#tsWarm)"/>
  <path d="M 176,220 C 196,220 194,300 214,300" fill="none" stroke="#7a9e8e" stroke-width="1.8" marker-end="url(#tsSage)"/>
  <text x="216" y="120" font-size="9.5" font-weight="700" letter-spacing="1.4" fill="#a9803f">SLEEPING OUTSIDE THE HOME</text>
  <rect x="216" y="128" width="140" height="52" rx="10" fill="#fbf1e4" stroke="#c9a87c" stroke-width="1.5"/>
  <text x="286" y="150" text-anchor="middle" font-size="12" font-weight="500" fill="#8a6a34">Protest</text>
  <text x="286" y="167" text-anchor="middle" font-size="9" fill="#a9803f">the anxious reaching</text>
  <rect x="378" y="128" width="140" height="52" rx="10" fill="#fbf1e4" stroke="#c9a87c" stroke-width="1.5"/>
  <text x="448" y="150" text-anchor="middle" font-size="12" font-weight="500" fill="#8a6a34">Despair</text>
  <text x="448" y="167" text-anchor="middle" font-size="9" fill="#a9803f">the heavy quiet</text>
  <rect x="540" y="128" width="156" height="52" rx="10" fill="#f0dcc0" stroke="#a9803f" stroke-width="1.5"/>
  <text x="618" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#8a6a34">Detachment</text>
  <text x="618" y="167" text-anchor="middle" font-size="9" fill="#a9803f">separate lives</text>
  <line x1="356" y1="154" x2="376" y2="154" stroke="#a9803f" stroke-width="1.8" marker-end="url(#tsWarm)"/>
  <line x1="518" y1="154" x2="538" y2="154" stroke="#a9803f" stroke-width="1.8" marker-end="url(#tsWarm)"/>
  <text x="540" y="199" font-size="9" font-weight="700" letter-spacing="1.4" fill="#a9803f">THE SLOW DRIFT</text>
  <text x="216" y="270" font-size="9.5" font-weight="700" letter-spacing="1.4" fill="#3d5c50">STAYING UNDER ONE ROOF</text>
  <rect x="216" y="278" width="140" height="52" rx="10" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.5"/>
  <text x="286" y="300" text-anchor="middle" font-size="12" font-weight="500" fill="#3d5c50">Relief without</text>
  <text x="286" y="317" text-anchor="middle" font-size="9" fill="#5f7d70">leaving: time-outs</text>
  <rect x="378" y="278" width="140" height="52" rx="10" fill="#eaf2ee" stroke="#7a9e8e" stroke-width="1.5"/>
  <text x="448" y="300" text-anchor="middle" font-size="12" font-weight="500" fill="#3d5c50">Contact stays</text>
  <text x="448" y="317" text-anchor="middle" font-size="9" fill="#5f7d70">alive</text>
  <rect x="540" y="278" width="156" height="52" rx="10" fill="#3d5c50" stroke="#3d5c50" stroke-width="1.5"/>
  <text x="618" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Clarity</text>
  <text x="618" y="317" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.82)">a decision you can hold</text>
  <line x1="356" y1="304" x2="376" y2="304" stroke="#7a9e8e" stroke-width="1.8" marker-end="url(#tsSage)"/>
  <line x1="518" y1="304" x2="538" y2="304" stroke="#7a9e8e" stroke-width="1.8" marker-end="url(#tsSage)"/>
  <text x="540" y="349" font-size="9" font-weight="700" letter-spacing="1.4" fill="#3d5c50">SPACE WITH A CORD</text>
  <text x="32" y="388" font-family="'Cormorant Garamond',Georgia,serif" font-size="13" font-style="italic" fill="#9a9490">When there is fear or violence, leaving is the safe road. See the note above.</text>
  <text x="688" y="401" text-anchor="end" font-size="8" fill="#c4bcae" letter-spacing="0.3">&#169; Joash Koh, LMFT</text>
</svg>
